  observed: '{"error": "Unauthorized"} on /docs, /api/v1 (GET), /x402/*, /.well-known/*, /status, /changelog'
  remediation: Not an authorization failure; the path is not served. The only routed API paths are the seven in the OpenAPI plus POST /api/trial.
