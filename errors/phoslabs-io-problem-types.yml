  observed: '{"error": "Invalid or inactive API key"} on POST /api/v1/diagnose with a bogus bearer; no WWW-Authenticate header'
  remediation: 'The key is unknown or has been deactivated ("API keys: duration of your account, deleted upon request" — privacy policy). Obtain a new key; do not retry with the same one.'
- status: 402
  title: Insufficient credits
  source: 'OpenAPI 402 "Insufficient credits" on all six POST operations'
  observed: not observed (requires a valid key with a zero balance)
  remediation: >-
    Buy a credit pack (EUR 5 / 500, EUR 20 / 2,000, EUR 100 / 10,000 at https://phoslabs.io/credits); credits
    are topped up on purchase. This is a billing 402, not an x402 payment challenge — no PAYMENT-REQUIRED
    header is documented for it. audit costs 0 credits and can be called on an empty balance.
- status: 403
