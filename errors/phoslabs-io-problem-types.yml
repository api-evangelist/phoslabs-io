- status: 401
  title: MCP authentication required
  observed: '{"error": "invalid_token", "error_description": "Authentication required"} on POST https://mcp.phoslabs.io/mcp; WWW-Authenticate: Bearer error="invalid_token", resource_metadata="https://mcp.phoslabs.io/.well-known/oauth-protected-resource/mcp"'
  remediation: Follow the RFC 9728 -> RFC 8414 chain and complete the OAuth 2.1 authorization-code + PKCE flow (dynamic registration at /register); see authentication/phoslabs-io-authentication.yml.
- status: 401
  title: MCP API key required (SSE transport)
  observed: '{"error":"unauthorized","message":"API key required. Pass Authorization: Bearer <key> header."} on GET/POST /sse and /messages'
  remediation: Use a REST API key as the Bearer token on the legacy SSE transport, or use /mcp with OAuth.
- status: 401
  title: MCP root path refuses non-initialize methods
  observed: '{"error":"use /mcp for full MCP access"} on tools/list, ping, prompts/list, resources/list, tools/call and notifications/initialized at https://mcp.phoslabs.io/'
  remediation: Point the client at https://mcp.phoslabs.io/mcp; the root only answers initialize.
