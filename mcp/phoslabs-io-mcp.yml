  description: Audit a design, intervention, or recommendation for dark patterns, manipulation, and autonomy violations.
  source: agent card skill ethics-check
readme_only_tools:
  note: >-
    The provider README (2026-04-04) tabulates 15 REST tools; the live GET /api/v1/tools answers 6 and the
    OpenAPI has 7 operations. These nine README entries have no live REST listing and no card skill:
    nudge, urgency, onboarding, reactivate, norms, survey, plus churn / social-proof / experiment which do
    appear as card skills. Third-party listings quote "23 tools across 3 product lines (CONVERT, RETAIN,
    UNDERSTAND)" and "35+ tools"; neither figure could be verified without a token.
  tools: [nudge, biases, urgency, churn, onboarding, reactivate, norms, survey, experiment, social-proof]
