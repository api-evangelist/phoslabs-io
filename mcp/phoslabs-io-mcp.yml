tools_introspection:
  method: tools/list
  status: gated
  note: >-
    Not introspected: /mcp requires an OAuth token, /sse an API key, and / refuses tools/list. The list below
    is assembled from provider-published sources and carries NO inputSchema; schemas require authenticated
    introspection. Names are the provider's identifiers where one exists (REST tool keys from
    GET /api/v1/tools; A2A skill ids from the agent card) and are not claimed to be the MCP tool names.
tools:
- name: audit
  description: Full behavioral audit of a product or service
  source: 'GET https://phoslabs.io/api/v1/tools (REST key audit; 0 credits)'
  source_operation: openapi/phoslabs-io-openapi.yml#audit
- name: diagnose
  description: Diagnose funnel dropoff with behavioral science
  source: 'GET /api/v1/tools (10 credits); agent card skill diagnose-dropoff'
  source_operation: openapi/phoslabs-io-openapi.yml#diagnose
- name: fix-checkout
  description: Redesign a checkout flow using behavioral science
  source: 'GET /api/v1/tools (30 credits); agent card skill fix-checkout'
  source_operation: openapi/phoslabs-io-openapi.yml#fixCheckout
- name: copy
  description: Rewrite copy using behavioral science principles
  source: 'GET /api/v1/tools (20 credits); agent card skill write-product-copy'
  source_operation: openapi/phoslabs-io-openapi.yml#copy
- name: pricing
  description: Optimize pricing strategy with behavioral science
  source: 'GET /api/v1/tools (25 credits); agent card skill optimize-pricing'
  source_operation: openapi/phoslabs-io-openapi.yml#pricing
- name: detect-biases
  description: Detect cognitive biases in text
  source: 'GET /api/v1/tools (8 credits)'
  source_operation: openapi/phoslabs-io-openapi.yml#detectBiases
- name: predict-churn
  description: Identify which customers are about to leave and why. Returns churn risk scores with behavioral drivers and retention interventions.
  source: 'agent card skill predict-churn; README lists /churn (15 credits) — not in the OpenAPI or the live /api/v1/tools listing'
- name: personalize-approach
  description: Segment customers by decision-making style and recommend tailored approaches for each segment.
  source: agent card skill personalize-approach
- name: add-social-proof
  description: Design social proof elements — what others bought, reviews, peer behavior signals.
  source: 'agent card skill add-social-proof; README lists /social-proof (10 credits) — not in the OpenAPI'
- name: run-experiment
  description: Design a rigorous A/B test with sample size calculations, metrics, treatment arms, and statistical power analysis.
  source: 'agent card skill run-experiment; README lists /experiment (15 credits) — not in the OpenAPI'
