client_config:
  claude_code: claude mcp add --transport http phoslabs https://mcp.phoslabs.io/mcp
  generic_json: '{"mcpServers":{"behavioral-science":{"url":"https://mcp.phoslabs.io/mcp"}}}'
  source: https://github.com/phoslabs/behavioral-science-api#mcp-integration (the JSON block is the provider's own example)
