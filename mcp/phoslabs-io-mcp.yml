summary: >-
  Phos Labs ships a hosted, remote MCP server on mcp.phoslabs.io and lists it twice in the official MCP
  registry: io.phoslabs/commerce-intelligence (4.0.0, streamable-http, remote url https://mcp.phoslabs.io/,
  published 2026-03-08) and io.phoslabs/behavioral-science (1.0.0, sse, remote url https://mcp.phoslabs.io/sse,
  published 2026-03-29). Three paths answer on the host and they are gated differently: POST /mcp is the
  full Streamable HTTP endpoint behind OAuth 2.1 (401 invalid_token with an RFC 9728 resource_metadata
  challenge; RFC 8414 metadata advertises PKCE, refresh tokens and dynamic client registration); POST / answers
  an anonymous MCP initialize (protocolVersion 2025-03-26, capabilities.tools, serverInfo "Phos Labs Commerce
  Intelligence" 1.0.0) and then rejects every other method — tools/list, ping, prompts/list, resources/list,
  tools/call, notifications/initialized — with 401 {"error":"use /mcp for full MCP access"}; GET/POST /sse and
  /messages want an API-key bearer ("API key required. Pass Authorization: Bearer <key> header."). tools/list
  could therefore not be introspected anonymously, so no inputSchema is recorded here: the tool inventory below
  is what the provider publishes elsewhere (the nine A2A card skills, the REST /api/v1/tools listing and the
  provider's own README), named as such. Billing is per tool call in credits (1 credit = EUR 0.01; agents start
  with free credits; packs at https://phoslabs.io/credits), and the provider states x402 USDC micropayments on
  Base L2 as an alternative rail.
deployment:
  mode: remote
  endpoint: https://mcp.phoslabs.io/mcp
  install: null
  package: null
  auth: oauth
  verified: probed
  note: >-
    Probed 2026-09-19. POST /mcp (initialize, tools/list) -> 401 with
    WWW-Authenticate: Bearer error="invalid_token", error_description="Authentication required",
    resource_metadata="https://mcp.phoslabs.io/.well-known/oauth-protected-resource/mcp". The metadata resolves
    (200) and names authorization server https://mcp.phoslabs.io/ whose RFC 8414 document (200) declares
    authorization_code + refresh_token grants, PKCE S256, token_endpoint_auth_methods including none (public
    clients), registration_endpoint /register and a single scope "claudeai". A conforming MCP client can
    therefore self-register and complete the flow without a pre-shared secret; a human still has to approve
    the authorization step and hold an account with credits. Alternative transports on the same host: /sse
    and /messages (legacy HTTP+SSE) accept an API key as a Bearer token instead of OAuth; the root path is a
    handshake-only surface. No stdio package exists on npm or PyPI (searched 2026-09-19), and the GitHub org
    phoslabs publishes documentation only.
  alternate_endpoints:
  - {url: 'https://mcp.phoslabs.io/', transport: streamable-http, auth: 'none for initialize; 401 "use /mcp for full MCP access" for every other method', registry: io.phoslabs/commerce-intelligence, probe: 'initialize 200; tools/list 401'}
  - {url: 'https://mcp.phoslabs.io/sse', transport: sse, auth: api-key bearer, registry: io.phoslabs/behavioral-science, probe: 'GET/POST 401 {"error":"unauthorized","message":"API key required. Pass Authorization: Bearer <key> header."}'}
  - {url: 'https://mcp.phoslabs.io/messages', transport: sse-messages, auth: api-key bearer, probe: 'POST 401 same body as /sse'}
