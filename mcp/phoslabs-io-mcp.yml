oauth:
  authorization_server: https://mcp.phoslabs.io/
  metadata: well-known/phoslabs-io-oauth-authorization-server.json
  protected_resource_metadata: well-known/phoslabs-io-oauth-protected-resource-mcp.json
  grants: [authorization_code, refresh_token]
  pkce: [S256]
  dynamic_client_registration: https://mcp.phoslabs.io/register
  revocation: https://mcp.phoslabs.io/revoke
  scopes: [claudeai]
