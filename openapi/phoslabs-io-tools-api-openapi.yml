openapi: 3.2.0
info:
  title: Phoslabs Io Tools API
  version: 1.0.0
  contact:
    url: https://phoslabs.io
  description: 'Operations tagged Tools across 2 of this provider''s published API definitions: phoslabs-io-openapi.json, phoslabs-io-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://phoslabs.io
  description: Production
security:
- BearerAuth: []
tags:
- name: Tools
paths:
  /api/v1/tools:
    get:
      summary: List available tools
      description: List all REST API tools with descriptions, pricing, and input schemas.
      operationId: listTools
      security: []
      responses:
        '200':
          description: Tool listing
      tags:
      - Tools
    servers:
    - url: https://phoslabs.io
      description: Production
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key from /api/trial or purchased at /credits
x-refined-from:
- phoslabs-io-openapi.json
- phoslabs-io-openapi.yml
