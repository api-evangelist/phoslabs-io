surface_relationship:
  note: >-
    The nine card skills are the product's marketing-level capability list. The REST contract
    (openapi/phoslabs-io-openapi.yml, 7 operations) covers four of them directly (diagnose, fix-checkout,
    copy, pricing); predict-churn, personalize-approach, add-social-proof, run-experiment and ethics-check
    have no REST operation in the published spec and are reachable, if at all, only through the OAuth-gated
    MCP endpoint whose tools/list could not be introspected. See mcp/phoslabs-io-tool-crosswalk.yml.
