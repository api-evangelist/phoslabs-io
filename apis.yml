apis:
- aid: phoslabs-io:behavioral-science-api
  name: Behavioral Science API
  description: >-
    Bearer-key JSON REST API on phoslabs.io. The provider-published OpenAPI 3.0.3 (verbatim in openapi/)
    declares seven operations — six metered POST tools (audit 0 credits, diagnose 10, fixCheckout 30, copy 20,
    pricing 25, detectBiases 8; 1 credit = EUR 0.01) and an anonymous GET /api/v1/tools (listTools) that
    returns the live inventory with prices and input fields. Keys are issued by POST /api/trial or by buying
    credits. Every response carries credits_remaining; errors are {"error": string}; no Idempotency-Key, no
    reversal path, rate limits unpublished. The provider README lists nine further tools the contract does
    not serve.
