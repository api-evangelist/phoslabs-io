aid: phoslabs-io
name: Phos Labs
description: >-
  Phos Labs is an independent studio that sells behavioral-science "commerce intelligence" to AI agents:
  diagnose where a funnel loses customers, redesign a checkout, rewrite offer copy, optimize price framing
  and detect cognitive biases. The surface is a Bearer-key REST API at phoslabs.io/api/v1 (OpenAPI 3.0.3, 7
  operations, an anonymous tool-and-price listing) and a hosted MCP server at mcp.phoslabs.io behind OAuth 2.1
  with RFC 8414 / RFC 9728 discovery and dynamic client registration, listed twice in the official MCP
  registry and described by an A2A-shaped agent card with nine skills. Billing is prepaid credits (1 credit =
  EUR 0.01) debited per call, with x402 USDC micropayments stated but not verifiable. The same domain also
  hosts Mind of Granite, a consumer decision-guidance product.
url: https://raw.githubusercontent.com/api-evangelist/phoslabs-io/refs/heads/main/apis.yml
