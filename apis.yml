- aid: phoslabs-io:phos-labs-mcp-server
  name: Phos Labs MCP Server
  description: >-
    Hosted, remote Model Context Protocol server. POST https://mcp.phoslabs.io/mcp is Streamable HTTP behind
    OAuth 2.1: the 401 challenge names RFC 9728 protected-resource metadata, whose authorization server
    (https://mcp.phoslabs.io/) publishes RFC 8414 metadata with authorization_code + refresh_token, PKCE S256,
    dynamic client registration and one scope, claudeai. The root path answers an anonymous initialize
    (protocolVersion 2025-03-26, serverInfo "Phos Labs Commerce Intelligence") and refuses every other method;
    /sse and /messages accept a REST API key as the Bearer token. Registered in the official MCP registry as
    io.phoslabs/commerce-intelligence (4.0.0) and io.phoslabs/behavioral-science (1.0.0). tools/list is gated,
    so the tool inventory is recorded from the agent card and REST listing without input schemas. The A2A
    agent card served on this host at /.well-known/agent-card.json (and agent.json) describes this server and
    grades flavored (no protocolVersion).
  humanURL: https://github.com/phoslabs/behavioral-science-api#mcp-integration
  baseURL: https://mcp.phoslabs.io/mcp
